<!-- lang: en-GB -->
<!-- Body fragment: overlays (norm §4.10). Render: python scripts/preview.py.
     Rule of thumb: anything that must escape a card, a table wrapper or the blurred header goes to the top layer
     (<dialog> / popover, layout A10). An absolute menu (A04) is fine only when no ancestor clips it. -->
<main class="mx-auto max-w-5xl space-y-12 px-4 py-8 sm:px-6">

  <!-- Dropdown menu, shown open. Trigger wrapper `relative inline-block`; menu `absolute end-0 top-full mt-1`
       (A04), w-max min-w-48 so items never wrap to the trigger's width (A05). Destructive item last, after a
       separator. data-room (harness) keeps the open menu inside this sample block. -->
  <div data-pattern="dropdown" data-case="open" data-room="below">
    <div class="flex justify-end">
      <div class="relative inline-block">
        <button type="button" aria-haspopup="menu" aria-expanded="true" class="inline-flex h-9 items-center justify-center gap-2 whitespace-nowrap rounded-md border border-line-strong bg-surface px-4 text-sm font-medium text-ink shadow-xs transition-colors duration-150 ease-standard hover:bg-surface-muted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-600">
          Actions
          <svg class="size-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div role="menu" class="absolute end-0 top-full z-40 mt-1 w-max min-w-48 rounded-lg border border-line bg-surface p-1 shadow-md">
          <button type="button" role="menuitem" class="flex h-9 w-full items-center gap-2 rounded-md px-3 text-sm text-ink hover:bg-surface-muted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-600">
            <svg class="size-4 shrink-0 text-ink-subtle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg>
            Export CSV
          </button>
          <button type="button" role="menuitem" class="flex h-9 w-full items-center gap-2 rounded-md px-3 text-sm text-ink hover:bg-surface-muted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-600">Duplicate</button>
          <div class="my-1 h-px bg-line" role="separator"></div>
          <button type="button" role="menuitem" class="flex h-9 w-full items-center gap-2 rounded-md px-3 text-sm text-danger-700 hover:bg-surface-muted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-600">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Same menu as a popover (A10): top layer, escapes the overflow-hidden card it lives in, light-dismiss,
       no JS. Unanchored it is centred in the viewport; anchor it with CSS anchor positioning where supported or a
       positioning library. Preflight zeroes margins: keep `m-auto` or set an explicit position. -->
  <div data-pattern="dropdown" data-case="popover">
    <div class="max-w-sm overflow-hidden rounded-lg border border-line bg-surface p-5">
      <button type="button" popovertarget="menu-pedido" class="inline-flex h-9 items-center justify-center gap-2 whitespace-nowrap rounded-md border border-line-strong bg-surface px-4 text-sm font-medium text-ink shadow-xs transition-colors duration-150 ease-standard hover:bg-surface-muted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-600">Order actions</button>
      <div id="menu-pedido" popover role="menu" class="m-auto w-max min-w-48 rounded-lg border border-line bg-surface p-1 text-ink shadow-md">
        <button type="button" role="menuitem" class="flex h-9 w-full items-center gap-2 rounded-md px-3 text-sm text-ink hover:bg-surface-muted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-600">Export CSV</button>
        <button type="button" role="menuitem" class="flex h-9 w-full items-center gap-2 rounded-md px-3 text-sm text-danger-700 hover:bg-surface-muted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-600">Delete</button>
      </div>
    </div>
  </div>

  <!-- Modal, shown open as a static mock (overlay `absolute inset-0` inside a relative box) so the render shows
       the panel. Product markup is the <dialog> below: `fixed inset-0 z-50` overlay is replaced by the top layer
       and `backdrop:bg-ink/40`. Widths: max-w-md confirm · max-w-lg short form · max-w-2xl long form.
       Footer: Cancelar before the action, gap-2, right-aligned (F03 / F01). -->
  <div data-pattern="modal" data-case="open-mock">
    <div class="relative h-80 overflow-hidden rounded-lg border border-dashed border-line-strong">
      <div class="absolute inset-0 z-50 grid place-items-center bg-ink/40 p-4">
        <div role="dialog" aria-modal="true" aria-labelledby="mock-title" class="w-full max-w-md rounded-xl bg-surface shadow-lg">
          <div class="px-6 pt-6">
            <h2 id="mock-title" class="text-base font-semibold text-ink">Delete order 1042?</h2>
          </div>
          <div class="px-6 py-4 text-sm text-ink-muted">The order leaves the reports. This cannot be undone.</div>
          <div class="flex justify-end gap-2 border-t border-line px-6 py-4">
            <button type="button" class="inline-flex h-9 items-center justify-center gap-2 whitespace-nowrap rounded-md border border-line-strong bg-surface px-4 text-sm font-medium text-ink shadow-xs transition-colors duration-150 ease-standard hover:bg-surface-muted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-600">Cancel</button>
            <button type="button" class="inline-flex h-9 items-center justify-center gap-2 whitespace-nowrap rounded-md bg-danger-600 px-4 text-sm font-medium text-ink-inverse transition-colors duration-150 ease-standard hover:bg-danger-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-600">Delete</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Product modal: <dialog> + showModal(). Esc closes, focus is trapped and returns to the opener, the page is
       inert. `m-auto` is required because preflight zeroes the UA margin that centres a dialog. -->
  <div data-pattern="modal" data-case="dialog">
    <button type="button" onclick="document.getElementById('dlg-excluir').showModal()" class="inline-flex h-9 items-center justify-center gap-2 whitespace-nowrap rounded-md bg-danger-600 px-4 text-sm font-medium text-ink-inverse transition-colors duration-150 ease-standard hover:bg-danger-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-600">Delete order</button>
    <dialog id="dlg-excluir" aria-labelledby="dlg-title" class="m-auto w-full max-w-md rounded-xl bg-surface p-0 text-ink shadow-lg backdrop:bg-ink/40">
      <form method="dialog">
        <div class="px-6 pt-6"><h2 id="dlg-title" class="text-base font-semibold text-ink">Delete order 1042?</h2></div>
        <div class="px-6 py-4 text-sm text-ink-muted">The order leaves the reports. This cannot be undone.</div>
        <div class="flex justify-end gap-2 border-t border-line px-6 py-4">
          <button value="cancel" class="inline-flex h-9 items-center justify-center gap-2 whitespace-nowrap rounded-md border border-line-strong bg-surface px-4 text-sm font-medium text-ink shadow-xs transition-colors duration-150 ease-standard hover:bg-surface-muted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-600">Cancel</button>
          <button value="confirm" class="inline-flex h-9 items-center justify-center gap-2 whitespace-nowrap rounded-md bg-danger-600 px-4 text-sm font-medium text-ink-inverse transition-colors duration-150 ease-standard hover:bg-danger-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-600">Delete</button>
        </div>
      </form>
    </dialog>
  </div>

  <!-- Tooltip. NOT IN THE NORM (proposal, see components/README.md "Norm gaps"): styled like the chart tooltip
       of §5.3 (ink background, 12px). Anchor `relative inline-flex`; tip `absolute bottom-full start-1/2
       -translate-x-1/2 mb-2 w-max max-w-xs` (A05); shown on hover and keyboard focus of the anchor via
       group-hover / group-focus-within. The classes are the product ones (hidden at rest); the harness attribute
       data-force-open makes preview.py show it for the render. Drop that attribute when copying. -->
  <div data-pattern="tooltip" data-case="open" data-room="above start">
    <div>
      <span class="group relative inline-flex" data-force-open>
        <button type="button" aria-label="Refresh" aria-describedby="tip-atualizar" class="inline-flex size-9 items-center justify-center rounded-md border border-line-strong bg-surface text-ink shadow-xs transition-colors duration-150 ease-standard hover:bg-surface-muted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-600">
          <svg class="size-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg>
        </button>
        <span id="tip-atualizar" role="tooltip" class="pointer-events-none invisible absolute start-1/2 bottom-full z-40 mb-2 w-max max-w-xs -translate-x-1/2 rounded-md bg-ink px-2 py-1 text-xs text-ink-inverse opacity-0 transition-opacity duration-150 ease-standard group-hover:visible group-hover:opacity-100 group-focus-within:visible group-focus-within:opacity-100 motion-reduce:transition-none">Refresh data now</span>
      </span>
    </div>
  </div>

</main>
