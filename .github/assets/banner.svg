<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">regency</title>
  <desc id="d">The Regent's harness, built on Claude Code: a governed PO, DV, QA and DA team that ends every unit of work at a review packet.</desc>
  <style>
    :root { --ground: #000000; --cyan: #00d7ff; --purple: #a66cff; --green: #2ea043; --green-dim: #0b3d22; --blue: #8fd3ff; }
    .ground { fill: var(--ground); }
    .grid line { stroke: var(--green-dim); stroke-width: 1; }
    .mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .title { fill: var(--cyan); font-size: 104px; font-weight: 700; letter-spacing: -2px; }
    .slash { fill: var(--purple); }
    .tagline { fill: var(--blue); font-size: 24px; }
    .prompt { fill: var(--green); font-size: 22px; }
    .unit { fill: var(--cyan); }
    .cursor { fill: var(--cyan); animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .pill rect { fill: var(--ground); stroke: var(--purple); stroke-width: 2; }
    .pill text { fill: var(--purple); font-size: 20px; font-weight: 700; text-anchor: middle; }
    .stage rect { fill: var(--ground); stroke: var(--green); stroke-width: 1.5; }
    .stage text { fill: var(--blue); font-size: 16px; text-anchor: middle; }
    .edge { stroke: var(--purple); stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .packet rect { fill: var(--cyan); }
    .packet text { fill: var(--ground); font-size: 16px; font-weight: 700; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a66cff"/>
    </marker>
  </defs>

  <rect class="ground" width="1280" height="360" rx="18"/>
  <g class="grid">
    <line x1="0" y1="72" x2="1280" y2="72"/><line x1="0" y1="144" x2="1280" y2="144"/>
    <line x1="0" y1="216" x2="1280" y2="216"/><line x1="0" y1="288" x2="1280" y2="288"/>
    <line x1="160" y1="0" x2="160" y2="360"/><line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/><line x1="640" y1="0" x2="640" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/><line x1="960" y1="0" x2="960" y2="360"/>
    <line x1="1120" y1="0" x2="1120" y2="360"/>
  </g>

  <text class="mono title" x="64" y="150"><tspan class="slash">/</tspan>regency</text>
  <text class="mono tagline" x="70" y="198">the Regent's harness · built on Claude Code</text>
  <text class="mono prompt" x="70" y="262">› /regency:team <tspan class="unit">M03.S02.T04 [F1–F3]</tspan><tspan class="cursor" dx="6">█</tspan></text>

  <g class="mono">
    <g class="pill"><rect x="760" y="56" width="92" height="40" rx="20"/><text x="806" y="83">PO</text></g>
    <g class="pill"><rect x="868" y="56" width="92" height="40" rx="20"/><text x="914" y="83">DV</text></g>
    <g class="pill"><rect x="976" y="56" width="92" height="40" rx="20"/><text x="1022" y="83">QA</text></g>
    <g class="pill"><rect x="1084" y="56" width="92" height="40" rx="20"/><text x="1130" y="83">DA</text></g>

    <g>
      <g class="stage"><rect x="760" y="138" width="124" height="40" rx="8"/><text x="822" y="163">frame</text></g>
      <g class="stage"><rect x="912" y="138" width="124" height="40" rx="8"/><text x="974" y="163">build</text></g>
      <g class="stage"><rect x="1064" y="138" width="124" height="40" rx="8"/><text x="1126" y="163">gate</text></g>
      <path class="edge" d="M 884 158 L 908 158"/>
      <path class="edge" d="M 1036 158 L 1060 158"/>
      <path class="edge" d="M 1126 178 L 1126 210 L 974 210 L 974 226"/>
      <g class="stage"><rect x="912" y="228" width="124" height="40" rx="8"/><text x="974" y="253">verify</text></g>
      <path class="edge" d="M 1036 248 L 1060 248"/>
      <g class="packet"><rect x="1064" y="228" width="148" height="40" rx="8"/><text x="1138" y="253">review packet</text></g>
    </g>
    <text class="tagline" x="760" y="318" style="font-size:18px">the Regent decides</text>
  </g>
</svg>
